<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome to My World</title>
<link href="./assets/fonts/poppins.css" rel="stylesheet">
<style>
:root { --bg:#000; --fg:#fff; --pad-x: clamp(20px, 6.95vw, 120px); }
html, body { height:100%; background:#000; color:#fff; font-family:'Poppins',sans-serif; -webkit-font-smoothing:antialiased; }
body { overflow:hidden; }
* { box-sizing:border-box; }

.hero { position:relative; width:100%; height:100vh; height:100svh; min-height:520px; overflow:hidden; background:#000; }
#scene { position:absolute; inset:0; width:100%; height:100%; display:block; cursor:grab; touch-action:none; }
#scene.dragging { cursor:grabbing; }
.ui { position:absolute; inset:0; pointer-events:none; z-index:2; }
.ui a, .ui button { pointer-events:auto; }
.sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

/* NAV */
.nav { position:absolute; top:clamp(24px,4.7vh,40px); left:var(--pad-x); right:var(--pad-x); display:flex; align-items:center; justify-content:space-between; }
.logo { display:flex; align-items:center; gap:8px; color:#fff; text-decoration:none; font-size:15px; letter-spacing:-0.01em; }
.logo-mark { width:20px; height:40px; background:#fff; border-radius:0 20px 20px 0; }
.logo b { font-weight:700; }
.logo span { font-weight:400; }
.nav-links { display:flex; gap:clamp(20px,4.1vw,60px); list-style:none; margin:0; padding:0; }
.nav-links a { color:#fff; text-decoration:none; font-size:15px; font-weight:500; position:relative; cursor:pointer; }
.nav-links a::after { content:''; position:absolute; left:0; right:0; bottom:-4px; height:1px; background:currentColor; transform:scaleX(0); transform-origin:right; transition:transform .35s ease; }
.nav-links a:hover::after { transform:scaleX(1); transform-origin:left; }

/* ARROWS */
.arrows { position:absolute; top:18.9%; left:76.7%; display:flex; gap:32px; transform:translate(-19px,-50%); }
.arrow { width:38px; height:38px; border-radius:50%; border:2.5px solid #fff; background:transparent; color:#fff; display:grid; place-items:center; cursor:pointer; transition:background .25s, color .25s; padding:0; }
.arrow svg { width:18px; height:18px; }
.arrow:hover { background:#fff; color:#000; }

/* DOTS */
.dots { position:absolute; right:calc(var(--pad-x) - 7px); top:49.4%; transform:translateY(-50%); display:flex; flex-direction:column; gap:33px; padding:0; margin:0; }
.dot { width:14px; height:14px; border-radius:50%; border:2px solid #fff; background:#fff; cursor:pointer; transition:background .25s; padding:0; }
.dot.active { background:transparent; }

/* TAGLINE */
.tagline { position:absolute; left:var(--pad-x); bottom:clamp(40px,7.5vh,70px); font-size:clamp(24px,2.65vw,44px); line-height:1.2; font-weight:300; letter-spacing:-0.01em; margin:0; }
.tagline strong { font-weight:700; display:block; }

/* CTA ROW */
.cta-row { position:absolute; left:45.6%; right:-1vw; top:88.7%; transform:translateY(-50%); display:flex; align-items:center; }
.cta { flex:none; padding:0 15px; height:48px; display:inline-flex; align-items:center; border:1.5px solid rgba(255,255,255,.85); border-radius:6px; background:rgba(0,0,0,.15); color:#fff; font-size:14px; font-weight:400; text-decoration:none; cursor:pointer; transition:background .25s, color .25s; }
.cta:hover { background:#fff; color:#000; }
.cta-line { flex:1; height:1.5px; background:rgba(255,255,255,.8); min-width:40px; }
.count { flex:none; font-size:clamp(140px,19.8vw,360px); font-weight:400; line-height:1; letter-spacing:-0.02em; color:transparent; -webkit-text-stroke:1.5px rgba(255,255,255,.9); transform:translateY(6%); user-select:none; }

/* LOADER */
.loader { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); font-size:12px; letter-spacing:.2em; text-transform:uppercase; opacity:.6; transition:opacity .6s; }
.loader.done { opacity:0; }


/* ANIMATED BACKGROUND */
.particles { position:absolute; inset:0; z-index:1; pointer-events:none; overflow:hidden; }
.petal { position:absolute; top:-8%; display:block; opacity:.85;
  background:radial-gradient(circle at 32% 30%,#ffe3f2,#f5a4cf 58%,rgba(245,164,207,0));
  border-radius:62% 2% 60% 38%;
  animation:fall linear infinite;
  filter:drop-shadow(0 0 6px rgba(255,170,220,.45)); }
@keyframes fall {
  0% { transform:translateY(-12vh) translateX(-2vw) rotate(0deg); }
  100% { transform:translateY(118vh) translateX(8vw) rotate(380deg); }
}

/* RESPONSIVE */
@media (max-width:900px), (max-aspect-ratio:1/1) {
  .arrows { left:auto; right:var(--pad-x); top:15%; transform:translateY(-50%); gap:14px; }
  .tagline { bottom:clamp(150px,20vh,220px); }
  .cta-row { left:var(--pad-x); right:-3vw; top:auto; bottom:24px; transform:none; }
  .count { font-size:clamp(120px,22vw,200px); }
}
@media (max-width:640px) {
  .nav-links { gap:16px; }
  .nav-links a, .logo { font-size:13px; }
  .dots { gap:20px; right:16px; }
  .dot { width:10px; height:10px; }
  .cta-row { right:-8vw; }
  .count { font-size:120px; }
}
@media (max-width:420px) { .nav-links li:nth-child(2) { display:none; } }
</style>
</head>
<body>
<section class="hero" id="hero">
  <canvas id="scene" aria-label="Rotatable glass cube. Drag to rotate."></canvas>
  <div class="particles" id="particles" aria-hidden="true"></div>
  <div class="ui">
    <h1 class="sr-only">Explore New Ideas</h1>
    <header class="nav">
      <a href="#" class="logo"><i class="logo-mark"></i><b>Design</b><span>World</span></a>
      <ul class="nav-links">
        <li><a href="#" id="modelSwitch">模型更换</a></li>
        <li><a>发现</a></li>
        <li><a>关于我们</a></li>
      </ul>
    </header>
    <div class="arrows">
      <button class="arrow" id="prev" aria-label="Previous">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      </button>
      <button class="arrow" id="next" aria-label="Next">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
    <nav class="dots">
      <button class="dot" aria-label="Slide 1"></button>
      <button class="dot active" aria-label="Slide 2"></button>
      <button class="dot" aria-label="Slide 3"></button>
    </nav>
    <p class="tagline">Let's Find our<br>Favorite <strong>Things.</strong></p>
    <div class="cta-row">
      <a href="wallpaper.html" class="cta">Explore Now</a>
      <span class="cta-line"></span>
      <span class="count" aria-hidden="true">07</span>
    </div>
    <div class="loader" id="loader">Loading model</div>
  </div>
</section>

<script src="./assets/three/three.bundle.js"></script>
<script src="./assets/model/rounded-cube-data.js"></script>
<script src="./assets/model/heart-data.js"></script>
<script src="./assets/model/rose-data.js"></script>
<script src="./assets/model/planet-data.js"></script>
<script src="./assets/model/ring-data.js"></script>
<script src="./assets/background/rem-bg-data.js"></script>
<script src="./assets/background/bg-presets-data.js"></script>
<script>
(function () {
  'use strict';
  const {
    WebGLRenderer, PerspectiveCamera, Scene, Group, Mesh,
    ShaderMaterial, CanvasTexture, PlaneGeometry, WebGLRenderTarget,
    HalfFloatType, RGBAFormat, LinearFilter, SRGBColorSpace,
    Vector2, Vector3, Quaternion, Clock, MathUtils,
    GLTFLoader, RoundedBoxGeometry, mergeVertices, mergeGeometries
  } = THREE;

  /* ---------- Renderer / camera ---------- */
  const canvas = document.getElementById('scene');
  const loaderEl = document.getElementById('loader');

  const renderer = new WebGLRenderer({ canvas, antialias:true, alpha:false });
  renderer.setClearColor(0x000000, 1);
  renderer.outputColorSpace = SRGBColorSpace;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

  const camera = new PerspectiveCamera(30, 1, 0.1, 100);
  camera.position.set(0, 0, 10);
  camera.lookAt(0, 0, 0);

  /* ---------- Background headline (offscreen 2D canvas) ---------- */
  const headlineCanvas = document.createElement('canvas');
  const hctx = headlineCanvas.getContext('2d');
  const headlineTexture = new CanvasTexture(headlineCanvas);
  headlineTexture.colorSpace = SRGBColorSpace;
  headlineTexture.minFilter = LinearFilter;
  headlineTexture.magFilter = LinearFilter;
  headlineTexture.generateMipmaps = false;

  let isMobile = false;

  /* animated photo background — switchable via the right-side dots.
     Each preset: src = image path, eye = {x,y} normalized glow position, or null */
  const BG_PRESETS = [
    { eye: null,                    src: './assets/background/bg-starry.jpg' },
    { eye: { x: 0.575, y: 0.275 },  src: './assets/background/rem-bg.jpg' },
    { eye: null,                    src: './assets/background/bg-neon.jpg' }
  ];
  // Under file://, local image paths would taint the canvas; use embedded data
  // URIs (window.BG_PRESET_DATA) whenever available.
  if (Array.isArray(window.BG_PRESET_DATA)) {
    BG_PRESETS.forEach((p, i) => {
      if (typeof window.BG_PRESET_DATA[i] === 'string') p.src = window.BG_PRESET_DATA[i];
    });
  }
  let bgIndex = 1;
  let bgReady = false;
  let bgOffsetX = 0, bgOffsetY = 0;
  let eyePulse = 0.6;
  let bgImage = new Image();
  bgImage.onload = function () { bgReady = true; };
  bgImage.src = BG_PRESETS[bgIndex].src;

  function paintBackground(W, H) {
    hctx.fillStyle = '#000';
    hctx.fillRect(0, 0, W, H);
    if (!bgReady) return;
    const cover = Math.max(W / bgImage.width, H / bgImage.height) * 1.08;
    const iw = bgImage.width * cover;
    const ih = bgImage.height * cover;
    const ix = (W - iw) / 2 + bgOffsetX;
    const iy = (H - ih) / 2 + bgOffsetY;
    hctx.drawImage(bgImage, ix, iy, iw, ih);

    // breathing glow over the character's glowing eye (only for presets that define one)
    const eye = BG_PRESETS[bgIndex].eye;
    if (eye) {
      const ex = ix + eye.x * iw;
      const ey = iy + eye.y * ih;
      const er = Math.min(W, H) * 0.10;
      const eg = hctx.createRadialGradient(ex, ey, 1, ex, ey, er);
      eg.addColorStop(0, 'rgba(255,120,215,' + (0.30 * eyePulse) + ')');
      eg.addColorStop(.35, 'rgba(170,90,255,' + (0.14 * eyePulse) + ')');
      eg.addColorStop(1, 'rgba(255,120,215,0)');
      hctx.fillStyle = eg;
      hctx.fillRect(ex - er, ey - er, er * 2, er * 2);
    }

    let g = hctx.createLinearGradient(0, 0, 0, H);
   g.addColorStop(0, 'rgba(0,0,0,.18)');
   g.addColorStop(.5, 'rgba(0,0,0,.09)');
   g.addColorStop(1, 'rgba(0,0,0,.24)');
    hctx.fillStyle = g;
    hctx.fillRect(0, 0, W, H);

    // soft extra darkening toward the right edge, keeping the left side brighter
    const lg = hctx.createLinearGradient(W * 0.32, 0, W, 0);
    lg.addColorStop(0, 'rgba(0,0,0,0)');
    lg.addColorStop(1, 'rgba(0,0,0,.14)');
    hctx.fillStyle = lg;
    hctx.fillRect(0, 0, W, H);

    const r = hctx.createRadialGradient(W * 0.53, H * 0.46, Math.min(W, H) * .12,
      W * 0.53, H * 0.46, Math.max(W, H) * .72);
    r.addColorStop(0, 'rgba(0,0,0,.24)');
    r.addColorStop(1, 'rgba(0,0,0,0)');
    hctx.fillStyle = r;
    hctx.fillRect(0, 0, W, H);

    // cover a small square artifact present in the source image (lower centre)
    const axp = ix + 0.50 * iw, ayp = iy + 0.83 * ih;
    const ar2 = Math.min(W, H) * 0.055;
    const ag2 = hctx.createRadialGradient(axp, ayp, 1, axp, ayp, ar2);
    ag2.addColorStop(0, 'rgba(0,0,0,.9)');
    ag2.addColorStop(1, 'rgba(0,0,0,0)');
    hctx.fillStyle = ag2;
    hctx.fillRect(axp - ar2, ayp - ar2, ar2 * 2, ar2 * 2);
  }

  /* sakura particles */
  (function buildParticles() {
    const box = document.getElementById('particles');
    if (!box) return;
    for (let i = 0; i < 16; i++) {
      const p = document.createElement('span');
      p.className = 'petal';
      const size = 8 + Math.random() * 12;
      p.style.left = (Math.random() * 100) + 'vw';
      p.style.width = size + 'px';
      p.style.height = (size * 0.82) + 'px';
      p.style.animationDuration = (9 + Math.random() * 10) + 's';
      p.style.animationDelay = (-Math.random() * 14) + 's';
      box.appendChild(p);
    }
  })();

  function drawHeadline(W, H, dpr) {
    headlineCanvas.width = Math.max(1, Math.round(W * dpr));
    headlineCanvas.height = Math.max(1, Math.round(H * dpr));
    hctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    paintBackground(W, H);

    isMobile = (W < 768) || (W / H < 1);
    const lines = ['Explore', 'New', 'Ideas'];

    let fs = Math.min(H * 0.21, W * (isMobile ? 0.21 : 0.118));
    hctx.font = '800 ' + fs + 'px Poppins, sans-serif';
    let widest = 0;
    for (const l of lines) widest = Math.max(widest, hctx.measureText(l).width);
    const maxW = W * (isMobile ? 0.9 : 0.5);
    if (widest > maxW) {
      fs *= maxW / widest;
      hctx.font = '800 ' + fs + 'px Poppins, sans-serif';
    }

    hctx.textAlign = 'center';
    hctx.textBaseline = 'alphabetic';

    const cx = W * (isMobile ? 0.5 : 0.505);
    const cy = H * (isMobile ? 0.45 : 0.468);
    const gap = fs * 1.07;
    const cap = fs * 0.7;

    /* per-line vertical fade: solid on the top half, dissolving to transparent
       on the bottom half so the background photo shows through */
    function lineFade(y) {
      const g = hctx.createLinearGradient(0, y - fs * 0.78, 0, y + fs * 0.22);
      g.addColorStop(0.0, 'rgba(255, 255, 255, 1)');
      g.addColorStop(0.42, 'rgba(233, 233, 242, 0.92)');
      g.addColorStop(0.75, 'rgba(200, 200, 220, 0.35)');
      g.addColorStop(1.0, 'rgba(184, 184, 204, 0)');
      return g;
    }

    /* drop shadow: floats the headline above the background */
    hctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
    hctx.shadowBlur = fs * 0.11;
    hctx.shadowOffsetY = fs * 0.035;

    for (let i = 0; i < lines.length; i++) {
      const y = cy + cap / 2 + (i - 1) * gap;
      hctx.fillStyle = lineFade(y);
      hctx.fillText(lines[i], cx, y);
    }

    /* faint pink rim light to keep the sakura/eye-pulse atmosphere */
    hctx.shadowColor = 'rgba(255, 170, 215, 0.32)';
    hctx.shadowBlur = fs * 0.06;
    hctx.shadowOffsetY = 0;
    for (let i = 0; i < lines.length; i++) {
      const y = cy + cap / 2 + (i - 1) * gap;
      hctx.fillStyle = lineFade(y);
      hctx.fillText(lines[i], cx, y);
    }

    /* hairline outline, also fading out toward the bottom */
    hctx.shadowBlur = 0;
    hctx.shadowOffsetY = 0;
    hctx.shadowColor = 'transparent';
    hctx.lineWidth = Math.max(1, fs * 0.004);
    for (let i = 0; i < lines.length; i++) {
      const y = cy + cap / 2 + (i - 1) * gap;
      hctx.strokeStyle = lineFade(y);
      hctx.strokeText(lines[i], cx, y);
    }

    /* extra brightness on the first line ("Explore") only */
    const y0 = cy + cap / 2 - gap;
    hctx.fillStyle = 'rgba(255, 255, 255, 0.40)';
    hctx.fillText(lines[0], cx, y0);

    headlineTexture.needsUpdate = true;
  }

  /* ---------- Background fullscreen quad ---------- */
  const bgScene = new Scene();
  const bgMat = new ShaderMaterial({
    uniforms: { uTex: { value: headlineTexture } },
    vertexShader: [
      'varying vec2 vUv;',
      'void main() {',
      '  vUv = uv;',
      '  gl_Position = vec4(position.xy, 0.0, 1.0);',
      '}'
    ].join('\n'),
    fragmentShader: [
      'uniform sampler2D uTex;',
      'varying vec2 vUv;',
      'void main() {',
      '  gl_FragColor = texture2D(uTex, vUv);',
      '  #include <colorspace_fragment>',
      '}'
    ].join('\n'),
    depthTest: false,
    depthWrite: false
  });
  const bgQuad = new Mesh(new PlaneGeometry(2, 2), bgMat);
  bgQuad.frustumCulled = false;
  bgScene.add(bgQuad);

  /* ---------- Glass material ---------- */
  const glassVert = [
    'varying vec3 vNormal;',
    'varying vec3 vEye;',
    'void main() {',
    '  vec4 worldPos = modelMatrix * vec4(position, 1.0);',
    '  vec4 mvPos = viewMatrix * worldPos;',
    '  gl_Position = projectionMatrix * mvPos;',
    '  vNormal = normalize(normalMatrix * normal);',
    '  vEye = normalize(mvPos.xyz);',
    '}'
  ].join('\n');

  const glassFrag = [
    'uniform sampler2D uTexture;',
    'uniform vec2 uResolution;',
    'uniform float uIorR;',
    'uniform float uIorY;',
    'uniform float uIorG;',
    'uniform float uIorC;',
    'uniform float uIorB;',
    'uniform float uIorP;',
    'uniform float uRefractPower;',
    'uniform float uChromatic;',
    'uniform float uSaturation;',
    'uniform float uShininess;',
    'uniform float uDiffuseness;',
    'uniform float uFresnelPower;',
    'uniform vec3 uLight;',
    'uniform float uBackside;',
    '',
    'varying vec3 vNormal;',
    'varying vec3 vEye;',
    '',
    'float specCalc(vec3 n, vec3 viewVec, vec3 light, float shininess, float diffuseness) {',
    '  vec3 lightVec = normalize(-light);',
    '  vec3 halfVec = normalize(lightVec + viewVec);',
    '  return pow(max(dot(n, halfVec), 0.0), shininess) + max(0.0, dot(n, lightVec)) * diffuseness;',
    '}',
    '',
    'void main() {',
    '  vec2 uv = gl_FragCoord.xy / uResolution;',
    '  vec3 n = normalize(vNormal);',
    '  if (uBackside > 0.5) { n = -n; }',
    '  vec3 eye = normalize(vEye);',
    '  vec3 viewVec = -eye;',
    '',
    '  const int LOOP = 16;',
    '  vec3 color = vec3(0.0);',
    '',
    '  for (int i = 0; i < LOOP; i++) {',
    '    float slide = float(i) / float(LOOP) * 0.045;',
    '',
    '    vec3 refrR = refract(eye, n, 1.0 / uIorR);',
    '    vec3 refrY = refract(eye, n, 1.0 / uIorY);',
    '    vec3 refrG = refract(eye, n, 1.0 / uIorG);',
    '    vec3 refrC = refract(eye, n, 1.0 / uIorC);',
    '    vec3 refrB = refract(eye, n, 1.0 / uIorB);',
    '    vec3 refrP = refract(eye, n, 1.0 / uIorP);',
    '',
    '    vec4 tR = texture2D(uTexture, uv + refrR.xy * (uRefractPower + slide * 1.0) * uChromatic);',
    '    vec4 tY = texture2D(uTexture, uv + refrY.xy * (uRefractPower + slide * 1.0) * uChromatic);',
    '    vec4 tG = texture2D(uTexture, uv + refrG.xy * (uRefractPower + slide * 2.0) * uChromatic);',
    '    vec4 tC = texture2D(uTexture, uv + refrC.xy * (uRefractPower + slide * 2.5) * uChromatic);',
    '    vec4 tB = texture2D(uTexture, uv + refrB.xy * (uRefractPower + slide * 3.0) * uChromatic);',
    '    vec4 tP = texture2D(uTexture, uv + refrP.xy * (uRefractPower + slide * 1.0) * uChromatic);',
    '',
    '    float r = tR.x * 0.5;',
    '    float y = (tY.x * 2.0 + tY.y * 2.0 - tY.z) / 6.0;',
    '    float g = tG.y * 0.5;',
    '    float c = (tC.y * 2.0 + tC.z * 2.0 - tC.x) / 6.0;',
    '    float b = tB.z * 0.5;',
    '    float p = (tP.z * 2.0 + tP.x * 2.0 - tP.y) / 6.0;',
    '',
    '    float R = r + (2.0 * p + 2.0 * y - c) / 3.0;',
    '    float G = g + (2.0 * y + 2.0 * c - p) / 3.0;',
    '    float B = b + (2.0 * c + 2.0 * p - y) / 3.0;',
    '',
    '    color += vec3(R, G, B);',
    '  }',
    '  color /= float(LOOP);',
    '',
    '  float luma = dot(color, vec3(0.2125, 0.7154, 0.0721));',
    '  color = mix(vec3(luma), color, uSaturation);',
    '',
    '  float spec = specCalc(n, viewVec, uLight, uShininess, uDiffuseness)',
    '    + 0.6 * specCalc(n, viewVec, vec3(1.0, 1.0, -1.0), uShininess * 0.6, uDiffuseness * 0.5);',
    '  color += spec * (uBackside > 0.5 ? 0.35 : 1.0);',
    '',
    '  float f = pow(1.0 + dot(eye, n), uFresnelPower);',
    '  color = mix(color, vec3(1.0), f * (uBackside > 0.5 ? 0.25 : 0.55));',
    '',
    '  color += vec3(0.004, 0.005, 0.007);',
    '  gl_FragColor = vec4(color, 1.0);',
    '  #include <colorspace_fragment>',
    '}'
  ].join('\n');

  function glassUniforms(backside, power) {
    return {
      uTexture:      { value: null },
      uResolution:   { value: new Vector2(1, 1) },
      uIorR:         { value: 1.15 },
      uIorY:         { value: 1.16 },
      uIorG:         { value: 1.18 },
      uIorC:         { value: 1.22 },
      uIorB:         { value: 1.22 },
      uIorP:         { value: 1.22 },
      uRefractPower: { value: power },
      uChromatic:    { value: 0.5 },
      uSaturation:   { value: 1.08 },
      uShininess:    { value: 90 },
      uDiffuseness:  { value: 0.02 },
      uFresnelPower: { value: 5.0 },
      uLight:        { value: new Vector3(-1, 1, 1) },
      uBackside:     { value: backside }
    };
  }

  const frontMat = new ShaderMaterial({
    uniforms: glassUniforms(0, 0.30),
    vertexShader: glassVert,
    fragmentShader: glassFrag,
    side: THREE.FrontSide
  });
  const backMat = new ShaderMaterial({
    uniforms: glassUniforms(1, 0.22),
    vertexShader: glassVert,
    fragmentShader: glassFrag,
    side: THREE.BackSide
  });

  /* ---------- Scene graph: scene -> pivot -> spinner -> cube ---------- */
  const scene = new Scene();
  const pivot = new Group();
  const spinner = new Group();
  spinner.rotation.set(-0.42, 0.62, 0.18);
  const cube = new Mesh(new RoundedBoxGeometry(1, 1, 1, 8, 0.12), frontMat);
  spinner.add(cube);
  pivot.add(spinner);
  scene.add(pivot);

  /* ---------- Render targets ---------- */
  const rtOpts = {
    type: HalfFloatType,
    format: RGBAFormat,
    minFilter: LinearFilter,
    magFilter: LinearFilter,
    depthBuffer: true,
    stencilBuffer: false
  };
  const rtBack = new WebGLRenderTarget(1, 1, rtOpts);
  const rtFront = new WebGLRenderTarget(1, 1, rtOpts);
  backMat.uniforms.uTexture.value = rtBack.texture;
  frontMat.uniforms.uTexture.value = rtFront.texture;

  /* ---------- Layout ---------- */
  function layout() {
    const W = window.innerWidth;
    const H = window.innerHeight;

    renderer.setSize(W, H);
    camera.aspect = W / H;
    camera.updateProjectionMatrix();

    const dpr = renderer.getPixelRatio();
    const bw = Math.round(W * dpr);
    const bh = Math.round(H * dpr);
    rtBack.setSize(bw, bh);
    rtFront.setSize(bw, bh);
    backMat.uniforms.uResolution.value.set(bw, bh);
    frontMat.uniforms.uResolution.value.set(bw, bh);

    drawHeadline(W, H, dpr);

    const fov = MathUtils.degToRad(camera.fov);
    const visH = 2 * Math.tan(fov / 2) * camera.position.z;
    const visW = visH * camera.aspect;

    const sx = isMobile ? 0.52 : 0.5;
    const sy = isMobile ? 0.65: 0.65;
    pivot.position.set((sx - 0.5) * visW, (0.5 - sy) * visH, 0);

    const px = Math.min(H * 0.41, W * (isMobile ? 0.39 : 0.17));
    const sc = (px / H) * visH * (MODEL_SOURCES[modelIndex] ? MODEL_SOURCES[modelIndex].scale : 1);
    pivot.scale.setScalar(sc);
  }

  /* ---------- Model processing ---------- */
  function normalizeGeometry(g) {
    g.computeBoundingBox();
    const c = new Vector3();
    g.boundingBox.getCenter(c);
    g.translate(-c.x, -c.y, -c.z);

    g.computeBoundingBox();
    const sz = new Vector3();
    g.boundingBox.getSize(sz);
    const m = Math.max(sz.x, sz.y, sz.z) || 1;
    g.scale(1 / m, 1 / m, 1 / m);
    g.computeVertexNormals();
    return g;
  }

  function buildFromGLTF(gltf) {
    gltf.scene.updateMatrixWorld(true);
    const parts = [];
    gltf.scene.traverse((o) => {
      if (o.isMesh) {
        let g = o.geometry.clone();
        if (g.attributes.uv) g.deleteAttribute('uv');
        if (g.attributes.color) g.deleteAttribute('color');
        if (g.attributes.tangent) g.deleteAttribute('tangent');
        g = mergeVertices(g, 1e-4);
        g.computeVertexNormals();
        g.applyMatrix4(o.matrixWorld);
        parts.push(g);
      }
    });
    if (parts.length === 0) throw new Error('GLB contains no meshes');
    const merged = parts.length > 1 ? mergeGeometries(parts, false) : parts[0];
    return normalizeGeometry(merged);
  }

  function setCubeGeometry(g) {
    cube.geometry.dispose();
    cube.geometry = g;
  }
  function fallbackGeometry() {
    setCubeGeometry(new RoundedBoxGeometry(1, 1, 1, 8, 0.12));
  }
  function loadingDone() {
    loaderEl.classList.add('done');
    layout();
  }

  function b64ToBuffer(b64) {
    const bin = atob(b64);
    const n = bin.length;
    const arr = new Uint8Array(n);
    for (let i = 0; i < n; i++) arr[i] = bin.charCodeAt(i);
    return arr.buffer;
  }

  function startModelLoad() {
    if (!window.MODEL_GLB_B64) { fallbackGeometry(); loadingDone(); return; }
    let parser;
    try {
      parser = new GLTFLoader();
      parser.parse(
        b64ToBuffer(window.MODEL_GLB_B64),
        '',
        (gltf) => {
          try { setCubeGeometry(buildFromGLTF(gltf)); }
          catch (e) { fallbackGeometry(); }
          loadingDone();
        },
        () => { fallbackGeometry(); loadingDone(); }
      );
    } catch (e) {
      fallbackGeometry();
      loadingDone();
    }
  }
  /* Per-model metadata: b64 data getter + individual size multiplier.
     Tweak `scale` to make a single model bigger (>1) or smaller (<1). */
  const MODEL_SOURCES = [
    { name: 'cube',   b64: () => window.MODEL_GLB_B64,  scale: 1.0 },
    { name: 'heart',  b64: () => window.HEART_GLB_B64,  scale: 1.25 },
    { name: 'rose',   b64: () => window.ROSE_GLB_B64,   scale: 1.4 },
    { name: 'planet', b64: () => window.PLANET_GLB_B64, scale: 1.4 },
    { name: 'ring',   b64: () => window.RING_GLB_B64,   scale: 1.2 }
  ];
  let modelIndex = 0;
  let switching = false;

  startModelLoad();

  /* ---------- Switch 3D model via the nav link ---------- */

  function switchModel(index) {
    if (switching || index === modelIndex) return;
    const b64 = MODEL_SOURCES[index].b64();
    if (!b64) { console.warn('Requested model data is not available.'); return; }
    switching = true;
    let parser;
    try { parser = new GLTFLoader(); }
    catch (e) { switching = false; return; }
    parser.parse(
      b64ToBuffer(b64),
      '',
      (gltf) => {
        switching = false;
        try {
          setCubeGeometry(buildFromGLTF(gltf));
          modelIndex = index;
          layout();
        } catch (e) {
          console.warn('Failed to build switched model:', e);
        }
      },
      () => { switching = false; console.warn('Failed to parse switched model.'); }
    );
  }

  const modelSwitchLink = document.getElementById('modelSwitch');
  modelSwitchLink.addEventListener('click', (e) => {
    e.preventDefault();
    switchModel((modelIndex + 1) % MODEL_SOURCES.length);
  });

  /* ---------- Interaction ---------- */
  const clock = new Clock();

  let dragging = false;
  let lastPX = 0, lastPY = 0;
  let accX = 0, accY = 0;
  let velX = 0, velY = 0;
  let spinRemaining = 0;
  let idleBlend = 0;
  let releaseAt = -10;

  const _axisX = new Vector3(1, 0, 0);
  const _axisY = new Vector3(0, 1, 0);
  const _q = new Quaternion();

  canvas.addEventListener('pointerdown', (e) => {
    dragging = true;
    canvas.setPointerCapture(e.pointerId);
    canvas.classList.add('dragging');
    lastPX = e.clientX;
    lastPY = e.clientY;
    accX = 0; accY = 0;
    velX = 0; velY = 0;
    spinRemaining = 0;
    idleBlend = 0;
  });

  canvas.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const dx = (e.clientX - lastPX) * 0.008;
    const dy = (e.clientY - lastPY) * 0.008;
    lastPX = e.clientX;
    lastPY = e.clientY;
    accY += dx;
    accX += dy;
  });

  function endDrag() {
    if (!dragging) return;
    dragging = false;
    canvas.classList.remove('dragging');
    velY = accY;
    velX = accX;
    accX = 0; accY = 0;
    releaseAt = clock.elapsedTime;
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  function startSpin(dir) {
    spinRemaining = dir * Math.PI / 2;
    velX = 0; velY = 0;
    releaseAt = clock.elapsedTime;
  }
  document.getElementById('prev').addEventListener('click', () => startSpin(-1));
  document.getElementById('next').addEventListener('click', () => startSpin(1));

  function switchBackground(index) {
    if (index === bgIndex || index < 0 || index >= BG_PRESETS.length) return;
    const prevIndex = bgIndex;
    const preset = BG_PRESETS[index];

    // immediate visual feedback on the dots
    bgIndex = index;
    document.querySelectorAll('.dot').forEach((d, i) => {
      d.classList.toggle('active', i === index);
    });

    const img = new Image();
    img.onload = function () {
      bgImage = img;
      bgReady = true;
    };
    img.onerror = function () {
      console.warn('Background image failed to load:', preset.src);
      // roll back to previous background
      bgIndex = prevIndex;
      document.querySelectorAll('.dot').forEach((d, i) => {
        d.classList.toggle('active', i === prevIndex);
      });
    };
    img.src = preset.src;
  }
  document.querySelectorAll('.dot').forEach((d, i) => {
    d.addEventListener('click', () => switchBackground(i));
  });

  let _lastLayoutW = 0, _lastLayoutH = 0;
  window.addEventListener('resize', () => {
    layout();
    _lastLayoutW = window.innerWidth;
    _lastLayoutH = window.innerHeight;
    renderScene();   // synchronous repaint inside the OS resize loop: no stale tiles
  });
  if (document.fonts && document.fonts.addEventListener) {
    document.fonts.addEventListener('loadingdone', () => {
      drawHeadline(window.innerWidth, window.innerHeight, renderer.getPixelRatio());
    });
  }

  /* ---------- Animation loop ---------- */
  function frame() {
    requestAnimationFrame(frame);

    const dt = Math.min(clock.getDelta(), 0.05);
    const W = window.innerWidth, H = window.innerHeight;
    const t = clock.elapsedTime;
    const f60 = dt * 60;

    // self-heal layout: if the viewport changed (missed resize event, maximize,
    // detached window), re-sync renderer/camera/targets/texture/cube immediately
    if (W !== _lastLayoutW || H !== _lastLayoutH) {
      layout();
      _lastLayoutW = W;
      _lastLayoutH = H;
    }

    bgOffsetX = Math.sin(t * 0.10) * W * 0.02;
    bgOffsetY = Math.cos(t * 0.08) * H * 0.015;
    eyePulse = 0.55 + 0.45 * Math.sin(t * 1.7);
    drawHeadline(W, H, renderer.getPixelRatio());

    if (dragging) {
      // live rotation: the cube follows the cursor while the button is held
      _q.setFromAxisAngle(_axisY, accY);
      spinner.quaternion.premultiply(_q);
      _q.setFromAxisAngle(_axisX, accX);
      spinner.quaternion.premultiply(_q);
      velY = accY;
      velX = accX;
      accX = 0; accY = 0;
    } else if (spinRemaining !== 0) {
      const step = spinRemaining * Math.min(1, 0.09 * f60);
      _q.setFromAxisAngle(_axisY, step);
      spinner.quaternion.premultiply(_q);
      spinRemaining -= step;
      if (Math.abs(spinRemaining) < 0.0005) spinRemaining = 0;
    } else {
      if (velX !== 0 || velY !== 0) {
        _q.setFromAxisAngle(_axisY, velY);
        spinner.quaternion.premultiply(_q);
        _q.setFromAxisAngle(_axisX, velX);
        spinner.quaternion.premultiply(_q);
        const d = Math.pow(0.94, f60);
        velX *= d;
        velY *= d;
        if (Math.abs(velX) < 1e-5) velX = 0;
        if (Math.abs(velY) < 1e-5) velY = 0;
      }
      if (t - releaseAt > 0.6) {
        idleBlend = Math.min(1, idleBlend + dt / 1.0);
      }
    }

    if (idleBlend > 0) {
      _q.setFromAxisAngle(_axisY, 0.0035 * idleBlend * f60);
      spinner.quaternion.premultiply(_q);
      _q.setFromAxisAngle(_axisX, 0.0012 * idleBlend * f60);
      spinner.quaternion.premultiply(_q);
    }

    renderScene();
  }

  /* Full render pipeline (also called synchronously from the resize handler,
     so the resized drawing buffer never shows browser-copied stale tiles) */
  function renderScene() {
    cube.material = backMat;
    renderer.setRenderTarget(rtBack);
    renderer.autoClear = true;
    renderer.render(bgScene, camera);

    renderer.setRenderTarget(rtFront);
    renderer.autoClear = true;
    renderer.render(bgScene, camera);
    renderer.autoClear = false;
    renderer.render(scene, camera);

    cube.material = frontMat;
    renderer.setRenderTarget(null);
    renderer.autoClear = true;
    renderer.render(bgScene, camera);
    renderer.autoClear = false;
    renderer.clearDepth();
    renderer.render(scene, camera);
    renderer.autoClear = true;
  }

  /* Wait for fonts (with timeout), then layout + start loop */
  let started = false;
  function start() {
    if (started) return;
    started = true;
    layout();
    _lastLayoutW = window.innerWidth;
    _lastLayoutH = window.innerHeight;
    frame();
  }

  Promise.race([
    Promise.all([
      document.fonts.load('800 100px Poppins'),
      document.fonts.ready
    ]),
    new Promise((r) => setTimeout(r, 2500))
  ]).then(start);
})();
</script>
</body>
</html>
